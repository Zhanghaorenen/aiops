services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIOPS_REDIS_PORT:-6379}:6379"
    environment:
      AIOPS_REDIS_PASSWORD: ${AIOPS_REDIS_PASSWORD:?Set a private Redis password}
    # Generate a private config file: password is not placed in process arguments.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$AIOPS_REDIS_PASSWORD"
        case "$$AIOPS_REDIS_PASSWORD" in *[!a-zA-Z0-9_-]*) echo 'Use a random URL-safe password' >&2; exit 1;; esac
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nsave ""\nappendonly no\n' "$$AIOPS_REDIS_PASSWORD" > /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$AIOPS_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 2s
      retries: 3

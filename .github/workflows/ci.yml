name: AIOps checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            agent/requirements.txt
            agent/ai-service/requirements.txt
      - run: python -m pip install -r agent/requirements.txt -r agent/ai-service/requirements.txt
      - run: python -m compileall -q agent/aiops_agent agent/ai-service/app
      - run: python -m unittest discover -s tests -v
        working-directory: agent
      - run: python -m unittest discover -s tests -v
        working-directory: agent/ai-service
  vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

name: Optional Qdrant integration
on:
  workflow_dispatch:
jobs:
  qdrant:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent/ai-service/requirements.txt
      - run: python -m unittest discover -s tests -p test_rag_components.py -v
        working-directory: agent/ai-service
        env:
          AIOPS_TEST_QDRANT_URL: http://127.0.0.1:6333

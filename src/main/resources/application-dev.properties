
# ===============================
# AI Ops 本地开发环境
# ===============================

# 本机私有配置位于 Git 忽略的 data/ 目录，环境变量仍可覆盖。
spring.config.import=optional:file:./data/local-run/dev-secrets.properties

# 服务端口
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/aiops?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${AIOPS_DB_PASSWORD}

# Flyway 数据库迁移
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT 签名密钥：Base64 编码，解码后至少 32 字节
aiops.jwt.secret=${AIOPS_JWT_SECRET}

# JWT 有效期
aiops.jwt.expiration=PT2H

# 管理员初始化（本地测试账号）
aiops.admin.username=${AIOPS_ADMIN_USERNAME:}
aiops.admin.password=${AIOPS_ADMIN_PASSWORD:}

# 前端跨域
aiops.web.allowed-origin=http://localhost:5173

# 开发日志
logging.level.com.aiops.backend=DEBUG
logging.level.org.springframework.security=INFO

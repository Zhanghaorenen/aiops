
# ===============================
# AI Ops 本地开发环境
# ===============================

# 服务端口
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/aiops?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# Flyway 数据库迁移
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT 签名密钥（仅本地开发）
# 至少使用满足 JWT 算法要求的密钥长度
aiops.jwt.secret=aiops-local-dev-only-jwt-secret-2026-change-before-production

# JWT 有效期
aiops.jwt.expiration=PT2H

# 管理员初始化（本地测试账号）
aiops.admin.username=admin
aiops.admin.password=Admin123456!

# 前端跨域
aiops.web.allowed-origin=http://localhost:5173

# 开发日志
logging.level.com.aiops.backend=DEBUG
logging.level.org.springframework.security=INFO

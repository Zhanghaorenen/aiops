spring.application.name=backend
spring.datasource.url=${AIOPS_DB_URL:jdbc:mysql://localhost:3306/aiops?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${AIOPS_DB_USERNAME:root}
spring.datasource.password=${AIOPS_DB_PASSWORD}
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.local-cache-scope=STATEMENT
mybatis-plus.type-handlers-package=com.aiops.backend.persistence
mybatis-plus.global-config.banner=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
aiops.jwt.secret=${AIOPS_JWT_SECRET}
aiops.jwt.expiration=PT2H
aiops.admin.username=${AIOPS_ADMIN_USERNAME:}
aiops.admin.password=${AIOPS_ADMIN_PASSWORD:}
aiops.web.allowed-origin=${AIOPS_WEB_ALLOWED_ORIGIN:http://localhost:5173}

spring.application.name=backend
aiops.chat-memory.worker-enabled=${AIOPS_CHAT_MEMORY_WORKER_ENABLED:true}
aiops.chat-memory.rounds=${AIOPS_CHAT_MEMORY_ROUNDS:5}
spring.data.redis.host=${AIOPS_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${AIOPS_REDIS_PORT:6379}
spring.data.redis.password=${AIOPS_REDIS_PASSWORD:}
spring.data.redis.database=${AIOPS_REDIS_DB:0}
spring.data.redis.connect-timeout=${AIOPS_REDIS_TIMEOUT:500ms}
spring.data.redis.timeout=${AIOPS_REDIS_TIMEOUT:500ms}
spring.data.redis.lettuce.shutdown-timeout=200ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-wait=500ms
spring.data.redis.repositories.enabled=false
aiops.redis.enabled=${AIOPS_REDIS_ENABLED:true}
aiops.redis.key-prefix=${AIOPS_REDIS_KEY_PREFIX:aiops:}
aiops.redis.cache-ttl=${AIOPS_REDIS_CACHE_TTL:5s}
spring.datasource.url=${AIOPS_DB_URL:jdbc:mysql://localhost:3306/aiops?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${AIOPS_DB_USERNAME:root}
spring.datasource.password=${AIOPS_DB_PASSWORD}
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.local-cache-scope=STATEMENT
mybatis-plus.type-handlers-package=com.aiops.backend.persistence
mybatis-plus.global-config.banner=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
aiops.jwt.secret=${AIOPS_JWT_SECRET}
aiops.jwt.expiration=PT2H
aiops.admin.username=${AIOPS_ADMIN_USERNAME:}
aiops.admin.password=${AIOPS_ADMIN_PASSWORD:}
aiops.web.allowed-origin=${AIOPS_WEB_ALLOWED_ORIGIN:http://localhost:5173}
